name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure CPU build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=OFF -DGGML_NATIVE=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Downloader tests
        run: python3 -m unittest discover -s tests -p 'test_download.py' -v
      - name: HTTP integration tests
        run: python3 -m unittest discover -s tests -p 'test_server.py' -v
      - name: UI streaming tests
        run: node tests/ui_test.cjs
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPOCKET_SANITIZE=ON -DGGML_METAL=OFF -DGGML_NATIVE=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Runtime and HTTP tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build --output-on-failure
          python3 -m unittest discover -s tests -p 'test_server.py' -v
